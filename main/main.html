<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cocofanto Search">
  <meta name="author" content="Aiden">
  <title>Cocofanto Search</title>

  <!-- Existing project resources kept intact -->
  <script src="uv/uv.bundle.js"></script>
  <script src="uv/uv.config.js"></script>
  <script src="/js/all.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #111;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      height: 68px;
      display: flex;
      align-items: center;
      padding: 0 28px;
      border-bottom: 1px solid #ececec;
      background: #fff;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-weight: 700;
      font-size: 19px;
      letter-spacing: -0.3px;
    }

    .brand img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 90px;
    }

    .search-shell {
      width: min(760px, 94vw);
      text-align: center;
    }

    .mascot {
      width: 235px;
      height: 235px;
      object-fit: contain;
      display: block;
      margin: 0 auto 8px;
    }

    h1 {
      margin: 0 0 26px;
      font-size: clamp(38px, 6vw, 56px);
      letter-spacing: -1.8px;
      line-height: 1;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      width: 100%;
      border: 1px solid #d8d8d8;
      border-radius: 999px;
      background: #fff;
      padding: 7px 8px 7px 18px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
      transition: .15s ease;
    }

    .search-wrap:focus-within {
      border-color: #bdbdbd;
      box-shadow: 0 4px 16px rgba(0,0,0,.09);
    }

    #search {
      flex: 1;
      width: auto !important;
      height: auto !important;
      margin: 0 !important;
      padding: 13px 7px !important;
      border: 0 !important;
      outline: 0 !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      background: transparent !important;
      color: #111 !important;
      text-align: left !important;
      font-family: Arial, Helvetica, sans-serif !important;
      font-size: 16px !important;
      font-weight: 400 !important;
    }

    #search::placeholder {
      color: #8a8a8a !important;
      font-weight: 400 !important;
    }

    .search-button {
      flex: 0 0 auto;
      border: 0;
      border-radius: 999px;
      background: #111;
      color: #fff;
      padding: 12px 19px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    #loading {
      display: none;
      margin-top: 16px;
      color: #777;
      font-size: 13px;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .loader {
      width: 17px;
      height: 17px;
      border: 2px solid #bbb;
      border-top-color: #222;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .subtext {
      margin-top: 14px;
      color: #929292;
      font-size: 12px;
    }

    @media (max-width: 620px) {
      header { padding: 0 16px; }
      .brand span { font-size: 17px; }
      .mascot { width: 190px; height: 190px; }
      main { padding-top: 25px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <img src="/img/cocofanto.png" alt="Cocofanto">
      <span>Cocofanto Search</span>
    </div>
  </header>

  <main>
    <div class="search-shell">
      <img class="mascot" src="/img/cocofanto.png" alt="Cocofanto">
      <h1>Cocofanto Search</h1>

      <div class="search-wrap">
        <!-- Existing project search element ID is intentionally preserved -->
        <input type="text" placeholder="Search or enter a URL" id="search" autocomplete="off">
        <button class="search-button" id="searchButton" type="button">Search</button>
      </div>

      <div id="loading">
        <span class="loader"></span>
        <span>Loading…</span>
      </div>

      <div class="subtext">Search and navigation interface</div>
    </div>
  </main>

  <!-- Existing navigation/search script preserved unchanged -->
  <script src="js/go.js"></script>

  <script>
    // Make the visible button trigger the same Enter-key event expected
    // by the existing page script, without changing that script.
    document.getElementById("searchButton").addEventListener("click", function () {
      const input = document.getElementById("search");
      input.focus();
      input.dispatchEvent(new KeyboardEvent("keydown", {
        key: "Enter",
        code: "Enter",
        keyCode: 13,
        which: 13,
        bubbles: true
      }));
    });
  </script>
</body>
</html>
