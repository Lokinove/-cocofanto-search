<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cocofanto</title>
  <meta name="description" content="Cocofanto">
  <meta name="author" content="Aiden">

  <script src="uv/uv.bundle.js"></script>
  <script src="uv/uv.config.js"></script>
  <script src="/js/all.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      overflow: hidden;
      background: #050814;
    }

    body {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(4, 8, 20, 0.48), rgba(4, 8, 20, 0.48)),
        url("/img/cocofanto-bg.jpg") center center / cover no-repeat;
      opacity: 0.82;
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255,255,255,0.05), rgba(0,0,0,0.25));
      z-index: 0;
      pointer-events: none;
    }

    .ui {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 22px 24px 28px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .shortcut-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-start;
    }

    .brand-chip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.10);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    }

    .brand-chip img {
      width: 34px;
      height: 34px;
      object-fit: contain;
    }

    .brand-chip span {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .shortcuts {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .shortcut {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-radius: 999px;
      text-decoration: none;
      color: #fff;
      font-size: 14px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(8px);
      transition: .15s ease;
    }

    .shortcut:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,0.16);
    }

    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px 0 40px;
    }

    .search-shell {
      width: min(860px, 96vw);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .mascot {
      width: 210px;
      height: 210px;
      object-fit: contain;
      filter: drop-shadow(0 10px 22px rgba(0,0,0,0.22));
      margin-bottom: 2px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(42px, 6vw, 70px);
      letter-spacing: -2px;
      line-height: 1;
      text-shadow: 0 4px 20px rgba(0,0,0,0.24);
    }

    .subtitle {
      margin: 0 0 24px;
      font-size: 14px;
      color: rgba(255,255,255,0.88);
      max-width: 650px;
      line-height: 1.5;
      text-shadow: 0 2px 10px rgba(0,0,0,0.22);
    }

    .search-wrap {
      width: min(760px, 96vw);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 8px 8px 18px;
      border-radius: 999px;
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(14px);
      box-shadow: 0 14px 36px rgba(0,0,0,0.18);
    }

    #search {
      flex: 1;
      width: auto !important;
      margin: 0 !important;
      height: auto !important;
      padding: 14px 8px !important;
      border: 0 !important;
      outline: 0 !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      background: transparent !important;
      color: #fff !important;
      text-align: left !important;
      font-family: Arial, Helvetica, sans-serif !important;
      font-size: 16px !important;
      font-weight: 400 !important;
    }

    #search::placeholder { color: rgba(255,255,255,0.72) !important; }

    .search-btn {
      flex: 0 0 auto;
      border: 0;
      border-radius: 999px;
      background: #ffffff;
      color: #111;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .helper {
      margin-top: 14px;
      font-size: 12px;
      color: rgba(255,255,255,0.78);
      text-shadow: 0 2px 10px rgba(0,0,0,0.22);
    }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: rgba(255,255,255,0.66);
      position: relative;
      z-index: 1;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }

    @media (max-width: 700px) {
      .ui { padding: 16px 16px 22px; }
      .topbar { flex-direction: column; align-items: flex-start; }
      .mascot { width: 170px; height: 170px; }
      .search-wrap {
        padding: 8px;
        flex-direction: column;
        border-radius: 24px;
      }
      .search-btn {
        width: 100%;
        padding: 13px 18px;
      }
      #search {
        width: 100% !important;
      }
      .brand-chip span { font-size: 17px; }
      .shortcuts { gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="ui">
    <div class="topbar">
      <div class="shortcut-block">
        <div class="brand-chip">
          <img src="/img/cocofanto.png" alt="Cocofanto">
          <span>Cocofanto</span>
        </div>

        <div class="shortcuts">
          <a class="shortcut" href="#" data-url="https://www.youtube.com/">▶ YouTube</a>
          <a class="shortcut" href="#" data-url="https://www.wikipedia.org/">W Wikipedia</a>
          <a class="shortcut" href="#" data-url="https://duckduckgo.com/">🔎 DuckDuckGo</a>
        </div>
      </div>
    </div>

    <div class="main">
      <div class="search-shell">
        <img class="mascot" src="/img/cocofanto.png" alt="Cocofanto">
        <h1>Cocofanto</h1>
        <p class="subtitle">Search or enter a URL. Plain searches are sent to DuckDuckGo to avoid the Google CAPTCHA loop.</p>

        <div class="search-wrap">
          <input id="search" type="text" autocomplete="off" placeholder="Search or enter a URL">
          <button class="search-btn" id="searchButton" type="button">Search</button>
        </div>

        <div class="helper">Examples: youtube.com, wikipedia.org, or "sheep"</div>
      </div>
    </div>

    <div class="footer-note">Cocofanto interface</div>
  </div>

  <script>
    function looksLikeURL(input) {
      if (!input) return false;
      if (/^https?:\/\//i.test(input)) return true;
      if (input.includes(" ")) return false;
      return /\.[a-z]{2,}(?:[/:?#]|$)/i.test(input);
    }

    function openThroughExistingRouting(raw) {
      const value = raw.trim();
      if (!value) return;

      let target;
      if (looksLikeURL(value)) {
        target = /^https?:\/\//i.test(value) ? value : "https://" + value;
      } else {
        target = "https://duckduckgo.com/?q=" + encodeURIComponent(value);
      }

      if (window.__uv$config && typeof __uv$config.encodeUrl === "function") {
        location.href = __uv$config.prefix + __uv$config.encodeUrl(target);
      } else {
        location.href = target;
      }
    }

    document.getElementById("searchButton").addEventListener("click", function () {
      openThroughExistingRouting(document.getElementById("search").value);
    });

    document.getElementById("search").addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        openThroughExistingRouting(this.value);
      }
    });

    document.querySelectorAll(".shortcut").forEach(function (el) {
      el.addEventListener("click", function (event) {
        event.preventDefault();
        openThroughExistingRouting(el.getAttribute("data-url"));
      });
    });
  </script>
</body>
</html>
